name: Offline preservation tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone test dependencies
        run: python -m pip install numpy==1.26.4 soundfile==0.14.0 tqdm==4.70.1
      - name: Check entrypoint, event bins and WAV publication
        run: python -m unittest discover -s tests -v
